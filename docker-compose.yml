services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  broker:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  producer:
    build: .
    depends_on:
      - broker
    command: python producer.py

  consumer_filter:
    build: .
    depends_on:
      - broker
    command: python consumer_filter.py

  consumer_rules:
    build: .
    depends_on:
      - broker
    command: python consumer_rules.py

  consumer_aggregator:
    build: .
    depends_on:
      - broker
    command: python consumer_aggregator.py

  ml_consumer:
    build: .
    depends_on:
      - broker
    command: python ml_consumer.py

  api:
    build: .
    depends_on:
      - broker
    ports:
      - "8001:8001"
    command: uvicorn machine_api:app --host 0.0.0.0 --port 8001